[package]
name = "renoir"
version = "0.1.0"
edition = "2024"

[features]
tokio = ["renoir-core/tokio"]
kafka = ["tokio", "dep:renoir-kafka"]

[dependencies]
renoir-core = { path = "../renoir-core", version = "0.6.1" }
renoir-kafka ={ path = "../renoir-kafka", version = "0.1.0", optional = true }

[dev-dependencies]
clap = { version = "4.5.51", features = ["derive"] }
criterion = { version = "0.7.0", features = ["html_reports"] }
env_logger = "0.11"
kstring = { version = "2.0.2", features = ["serde"] }
mimalloc = { version = "0.1.48", default-features = false }
once_cell = "1.21.3"
rand = { version = "0.9.2", features = ["small_rng"] }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros"], default-features = false }
tracing = { version = "0.1.41", features = ["log"] }
tracing-subscriber = "0.3.20"
wyhash = "0.6.0"

[[example]]
name = "kafka"
required-features = ["kafka"]

[[example]]
name = "kafka_wordcount"
required-features = ["kafka"]

[[bench]]
name = "kafka"
harness = false
required-features = ["kafka"]
